format_version = 1
id = "lc_circuit"

[units]
energy = "GHz"
time = "ns"

[model]
kind = "circuit"
nodes = [0, 1]
ground = 0
offset_charges = {}

[[model.branches]]
id = "capacitor"
kind = "C"
nodes = [0, 1]
