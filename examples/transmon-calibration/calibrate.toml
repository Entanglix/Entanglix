format_version = 1
system = "system.toml"
datasets = ["training.toml"]
merge_tolerance = 1e-3

[parameters]
EJ1 = { scale = 1.0 }
EJ2 = { scale = 1.0 }
Csh = { scale = 10.0 }

# Coil bias in mA to the flux parameter: phi = (bias - offset) / period.
[axis_map]
flux = "phi"
offset = { lower = -0.5, upper = 0.5, scale = 0.01 }
period = { lower = 0.5, upper = 2.0, scale = 0.01 }

# Transitions from levels 0 and 1 up to level 3, at one and two photons.
[family]
initial = [0, 1]
max_level = 3
photons = [1, 2]

# Each column's strongest peak is taken to be 0-1 for the first fit.
[matching]
anchor = "0-1"
range_ghz = 0.3
cutoff = 5.0
resolution = 2.0
range_iterations = 20
cutoff_iterations = 20

[extraction]
background_window_ghz = 0.1
threshold = 6.0
min_separation_ghz = 0.01
fit_half_window_ghz = 0.02
linewidth_bounds_ghz = [2e-4, 0.02]
line_shape = "lorentzian"

[conventions]
offset_window = -0.5
exchange = [["EJ1", "EJ2"]]

# Used by the refinement check only; the fit keeps the system's truncation.
[refinement.squid_transmon]
retained_levels_step = 2
cutoff_steps = { theta1 = 10 }

# The design values with a nominal coil offset and period, and a start a few percent the other way.
[[starts]]
EJ1 = 12.4
EJ2 = 7.7
Csh = 72.0
offset = 0.13
period = 1.03

[[starts]]
EJ1 = 11.6
EJ2 = 8.3
Csh = 68.0
offset = 0.07
period = 0.97
