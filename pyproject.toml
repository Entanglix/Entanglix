[project]
name = "entanglix"
version = "0.1.0"
description = "Expert-guided quantum system research harness"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.3,<3",
    "pydantic>=2.12,<3",
    "qutip>=5.2,<6",
    "scipy>=1.15,<2",
    "scqubits==4.3.1",
    "tomli-w>=1.2,<2",
]

[project.optional-dependencies]
differentiable = ["dynamiqs==0.3.6", "jax==0.6.2"]
differentiable-cuda12 = ["dynamiqs==0.3.6", "jax[cuda12]==0.6.2"]
cuquantum = ["qutip-cuquantum[cuda12]==0.3.1"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
entanglix = "entanglix.cli:main"

[build-system]
requires = ["uv_build==0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["jsonschema>=4,<5", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.uv]
required-version = ">=0.12,<0.13"
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["gpu: requires an NVIDIA GPU visible to the test process"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.entanglix.import-boundary]
allowed-third-party = ["cupy", "cuquantum", "dynamiqs", "jax", "matplotlib", "mcp", "numpy", "pydantic", "qutip", "qutip_cuquantum", "scipy", "scqubits", "tomli_w"]
