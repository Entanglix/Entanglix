format_version = 1

[output]
trace_atol = 1e-8
hermiticity_atol = 1e-8
minimum_eigenvalue = -1e-8
initial_state_atol = 1e-8
top_level_population_warning = 1e-6

[refinement]
observable_atol = 1e-6
excitation_convergence_atol_ghz = 1e-5
rtol = 1e-11
atol = 1e-13
tolerance_factor = 0.1
min_retained_levels_step = 1
min_cutoff_step = 2

[evidence]
max_points = 8

[segments]
max_segments = 8
segment_intervals = 2

[control]
fidelity_atol = 1e-7
amplitude_atol_ghz = 1e-7
du_atol_ghz_per_ns = 1e-7
ddu_atol_ghz_per_ns2 = 1e-7
rtol = 1e-11
atol = 1e-13
max_steps = 100000

[uncertainty]
# A sampled logical state whose overlap with its nominal state is below this is reported as ambiguous.
min_state_overlap = 0.7

[calibration]
# The identifiability recomputation's tolerances, reported beside the fit's own. Holdout
# prediction uncertainties use the same recomputed covariance.
rank_rtol = 1e-6
undetermined_tolerance = 1e-3
jacobian_step = 1e-5
# Recomputed uncertainties, correlations, undetermined combinations and chi-squared agree
# with the fit's report within this relative tolerance.
agreement_rtol = 1e-6
